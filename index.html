<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freshservice Academy</title>
<meta name="theme-color" content="#12344D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FS Academy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="A practical, example-led course on Freshservice for new service desk agents, with a hands-on practice desk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
:root{
  --rail:#12344D; --rail-2:#1B4565; --rail-ink:#B9CBDB;
  --bg:#F3F5F7; --card:#FFFFFF; --ink:#12344D; --ink-2:#475867; --ink-3:#6F7C87; --line:#DADFE4; --line-2:#EBEFF3;
  --blue:#2C5CC5; --blue-2:#E5ECFA; --blue-ink:#1F4AA8;
  --green:#00795B; --green-bg:#E0F5EE; --amber:#9A6200; --amber-bg:#FDF1D8; --red:#C42B1C; --red-bg:#FCE7E4;
  --violet:#6B3FB5; --violet-bg:#EFE8FA; --teal:#00727A; --teal-bg:#DDF2F3;
  --p-low:#00795B; --p-med:#2C5CC5; --p-high:#C25A00; --p-urg:#C42B1C;
  --shadow:0 1px 2px rgba(18,52,77,.08),0 4px 14px -6px rgba(18,52,77,.18);
  --font:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --rail:#0B1F2E; --rail-2:#163650; --rail-ink:#93A9BC;
    --bg:#0F1720; --card:#17222E; --ink:#E4EBF1; --ink-2:#B0BDC8; --ink-3:#8796A3; --line:#2A3846; --line-2:#22303C;
    --blue:#6E97F0; --blue-2:#1C2D4D; --blue-ink:#9BB7F5;
    --green:#3CC79B; --green-bg:#0F3328; --amber:#E6B24A; --amber-bg:#3A2C0D; --red:#F07A6C; --red-bg:#3E1914;
    --violet:#B596EC; --violet-bg:#2A1E42; --teal:#4CC6CE; --teal-bg:#0E3336;
    --p-low:#3CC79B; --p-med:#6E97F0; --p-high:#F0A050; --p-urg:#F07A6C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --rail:#0B1F2E; --rail-2:#163650; --rail-ink:#93A9BC;
  --bg:#0F1720; --card:#17222E; --ink:#E4EBF1; --ink-2:#B0BDC8; --ink-3:#8796A3; --line:#2A3846; --line-2:#22303C;
  --blue:#6E97F0; --blue-2:#1C2D4D; --blue-ink:#9BB7F5;
  --green:#3CC79B; --green-bg:#0F3328; --amber:#E6B24A; --amber-bg:#3A2C0D; --red:#F07A6C; --red-bg:#3E1914;
  --violet:#B596EC; --violet-bg:#2A1E42; --teal:#4CC6CE; --teal-bg:#0E3336;
  --p-low:#3CC79B; --p-med:#6E97F0; --p-high:#F0A050; --p-urg:#F07A6C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0 0 12px}
code,kbd{font-family:var(--mono);font-size:.86em;background:var(--line-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- app shell: rail + top bar ---------- */
.shell{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
.rail{background:var(--rail);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:30}
.rail .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;margin-bottom:12px}
.rail .logo svg{width:24px;height:24px}
.rail a{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:var(--rail-ink);text-decoration:none;position:relative}
.rail a svg{width:22px;height:22px}
.rail a:hover{background:var(--rail-2);color:#fff}
.rail a[aria-current="page"]{background:var(--rail-2);color:#fff}
.rail a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:#fff}
.rail .tip{position:absolute;left:56px;white-space:nowrap;background:var(--rail);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;opacity:0}
.rail a:hover .tip{opacity:1}
.rail .spacer{flex:1}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:12px;padding:0 20px}
.top .title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;width:min(320px,40vw)}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--ink);width:100%}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}
main{min-width:0}
.page{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
.page.narrow{max-width:820px}

.rail a .lbl{display:none}
/* mobile: rail becomes bottom tab bar */
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);gap:0}
  .rail .logo,.rail .spacer,.rail .tip{display:none}
  .rail a{width:auto;flex:1;height:50px;display:flex;flex-direction:column;gap:2px;font-size:10.5px}
  .rail a .lbl{display:block}
  .rail a[aria-current="page"]::before{left:30%;right:30%;top:-6px;bottom:auto;width:auto;height:3px}
  :root{padding-bottom:0}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .top{top:env(safe-area-inset-top,0px);padding:0 14px}
  .search{display:none}
  .page{padding:18px 14px 40px}
  h1{font-size:24px}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}

/* ---------- common bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.lede{font-size:17px;color:var(--ink-2);max-width:68ch}
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.blue{background:var(--blue-2);color:var(--blue-ink)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.violet{background:var(--violet-bg);color:var(--violet)}
.tag.teal{background:var(--teal-bg);color:var(--teal)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pri-Low{--pc:var(--p-low)} .pri-Medium{--pc:var(--p-med)} .pri-High{--pc:var(--p-high)} .pri-Urgent{--pc:var(--p-urg)}
.pri{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.pri .dot{background:var(--pc)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.widget{overflow-x:auto}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--rail);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:100;box-shadow:var(--shadow)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;margin-bottom:26px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:34px;line-height:1.15;margin-bottom:10px}
@media (max-width:760px){.hero h1{font-size:27px}}
.miniconsole{border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card);font-size:12.5px}
.miniconsole .mc-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700}
.miniconsole .mc-row{display:grid;grid-template-columns:16px 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.miniconsole .mc-row:last-child{border-bottom:0}
.miniconsole .mc-sub{font-weight:600}
.miniconsole .mc-meta{color:var(--ink-3);font-size:11.5px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 26px}
@media (max-width:760px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--ink-3)}
.track{margin-top:28px}
.track h2{margin-bottom:4px}
.track > p{color:var(--ink-2);margin-bottom:12px}
.modlist{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;text-decoration:none;color:inherit}
.mod:hover{border-color:var(--blue)}
.mod .num{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--blue-2);color:var(--blue-ink)}
.mod h3{font-size:16px}
.mod p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.mod .prog{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.bar{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;width:90px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}

/* ---------- module + lesson ---------- */
.modhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.outcomes{margin:14px 0 20px;padding:14px 18px}
.outcomes ul{margin:6px 0 0;padding-left:20px}
.lessons{display:grid;gap:8px}
.les{display:flex;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:inherit}
.les:hover{border-color:var(--blue)}
.les .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.les.done .chk{background:var(--green);border-color:var(--green)}
.les .t{flex:1}
.les .t small{display:block;color:var(--ink-3)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px}
@media (max-width:1000px){.lesson{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:76px;align-self:start;font-size:13px}
.toc b{display:block;margin-bottom:6px;color:var(--ink-3);font-weight:600}
.toc a{display:block;color:var(--ink-2);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--blue);border-left-color:var(--blue)}
.article{max-width:72ch}
.article > *{margin-bottom:14px}
.article h2{margin-top:30px;font-size:20px}
.article h3{margin-top:18px}
.article ul,.article ol{padding-left:22px}
.article li{margin:4px 0}
.layer{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3);margin:26px 0 6px;letter-spacing:.02em}
.layer i{width:18px;height:2px;background:var(--line);display:inline-block}
.topview{font-size:17px;line-height:1.55;padding:16px 18px;border-left:4px solid var(--blue);background:var(--card);border-radius:0 10px 10px 0;box-shadow:var(--shadow)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.path span{background:var(--line-2);padding:2px 8px;border-radius:4px}
.path em{font-style:normal;color:var(--ink-3)}
.callout{padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.callout b.h{display:block;margin-bottom:2px}
.callout.tip{border-left:4px solid var(--green)}
.callout.watch{border-left:4px solid var(--amber);background:var(--amber-bg);border-color:transparent}
.callout.example{border-left:4px solid var(--violet)}
.callout.real{border-left:4px solid var(--teal)}
.callout.plain{border-left:4px solid var(--teal);background:var(--teal-bg);border-color:transparent}
.refs{display:grid;gap:8px}
.refcard{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;text-decoration:none;color:inherit}
.refcard:hover{border-color:var(--blue)}
.refcard .ri{width:28px;height:28px;border-radius:7px;background:var(--blue-2);color:var(--blue-ink);display:grid;place-items:center;font-weight:800;flex:none}
.refcard b{display:block;color:var(--blue)}
.refcard small{display:block;color:var(--ink-2);font-size:13px}
.refcard small.url{color:var(--ink-3);font-size:12px;overflow-wrap:anywhere}
.guidebn{display:flex;gap:14px;align-items:center;padding:14px 16px;text-decoration:none;color:inherit;border-left:4px solid var(--teal);margin-top:4px}
.guidebn .gi{width:36px;height:36px;border-radius:50%;background:var(--teal-bg);color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.guidebn small{display:block;color:var(--ink-2);font-size:13.5px}
.guidebn .btn{margin-left:auto}
@media (max-width:760px){.guidebn .btn{display:none}}
.chip.right{border-color:var(--green);background:var(--green-bg);color:var(--green);opacity:1}
.chip.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);opacity:1}
.chip[disabled]{cursor:default}
.callout p:last-child{margin-bottom:0}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--line-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--blue-2);color:var(--blue-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line-2)}
th{background:var(--bg);font-weight:700;font-size:13px;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
.quiz{padding:16px 18px}
.quiz .q{font-weight:700;margin-bottom:10px}
.quiz .opts{display:grid;gap:8px}
.quiz .opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px}
.quiz .opt:hover{border-color:var(--blue)}
.quiz .opt.right{border-color:var(--green);background:var(--green-bg)}
.quiz .opt.wrong{border-color:var(--red);background:var(--red-bg)}
.quiz .why{margin-top:10px;font-size:14px;color:var(--ink-2)}
.pager{display:flex;gap:12px;justify-content:space-between;margin-top:30px}
.pager a{flex:1;padding:12px 16px;text-decoration:none;color:inherit;font-size:14px}
.pager a small{display:block;color:var(--ink-3)}
.pager a.nx{text-align:right}
.donebar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 16px;margin-top:26px}

/* ---------- mock screens (static, annotated) ---------- */
.mock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);font-size:13px}
.mock .m-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.mock .m-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.mock .m-body{padding:12px}
.mock .cap{padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);background:var(--bg)}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--violet);color:#fff;font-size:11px;font-weight:800;flex:none}
.legend{display:grid;gap:6px;margin-top:10px}
.legend div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}

/* ---------- practice desk (agent console) ---------- */
.desk{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);min-height:560px;box-shadow:var(--shadow)}
@media (max-width:900px){.desk{grid-template-columns:1fr}.desk.open .tlist{display:none}.desk:not(.open) .tview{display:none}}
.tlist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.tlist .tl-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.tlist select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:5px 6px}
.titem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-2);background:none;padding:10px 12px;cursor:pointer}
.titem:hover{background:var(--bg)}
.titem.sel{background:var(--blue-2)}
.titem .ts{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .tm{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.tview{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-width:0}
@media (max-width:1100px){.tview{grid-template-columns:1fr}}
.conv{min-width:0;display:flex;flex-direction:column}
.conv .cv-h{padding:12px 16px;border-bottom:1px solid var(--line)}
.conv .cv-h h3{font-size:17px}
.conv .tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.msgs{padding:12px 16px;display:grid;gap:10px;flex:1;align-content:start}
.msg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.msg.note{background:var(--amber-bg);border-color:transparent}
.msg.agent{border-left:3px solid var(--blue)}
.msg.sys{background:none;border-style:dashed;color:var(--ink-3);font-size:12.5px;padding:6px 10px}
.msg .mh{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);margin-bottom:4px;flex-wrap:wrap}
.msg .mh b{color:var(--ink)}
.msg .mb{font-size:14px;white-space:pre-wrap}
.composer{border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:8px}
.composer textarea{width:100%;min-height:84px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--card);color:var(--ink);resize:vertical}
.props{border-left:1px solid var(--line);padding:12px 14px;display:grid;gap:10px;align-content:start;background:var(--bg)}
@media (max-width:1100px){.props{border-left:0;border-top:1px solid var(--line)}}
.props h4{font-size:13px;color:var(--ink-3);font-weight:700}
.props label{display:grid;gap:3px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.props select,.props input{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--card);color:var(--ink);width:100%}
.sla{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 10px;font-size:12.5px;display:grid;gap:4px}
.sla .ok{color:var(--green);font-weight:700}.sla .late{color:var(--red);font-weight:700}.sla .paused{color:var(--amber);font-weight:700}
.missions{margin-bottom:16px}
.mission{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.mission:last-child{border-bottom:0}
.mission .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.mission.ok .mk{background:var(--green);border-color:var(--green)}
.mission .goals{margin:6px 0 0;padding-left:0;list-style:none;font-size:13px;display:grid;gap:3px}
.mission .goals li::before{content:"○ ";color:var(--ink-3)}
.mission .goals li.met{color:var(--green)}
.mission .goals li.met::before{content:"● "}
.modal{position:fixed;inset:0;background:rgba(10,25,40,.5);display:grid;place-items:center;z-index:90;padding:16px}
.modal .box{background:var(--card);border-radius:10px;max-width:520px;width:100%;max-height:80vh;overflow:auto;box-shadow:var(--shadow)}
.modal .box header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal .box .bd{padding:12px 16px;display:grid;gap:8px}
.pick{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--card);text-align:left}
.pick:hover{border-color:var(--blue)}
.pick small{display:block;color:var(--ink-3)}

/* ---------- widgets ---------- */
.widget{padding:16px 18px}
.widget h4{margin-bottom:8px}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:13px}
.matrix .hd{font-weight:700;color:var(--ink-3);padding:6px;text-align:center}
.matrix .cell{border:2px solid transparent;border-radius:6px;padding:10px 6px;text-align:center;font-weight:700;cursor:pointer;background:var(--bg)}
.matrix .cell.on{border-color:var(--ink)}
.matrix .cell.Low{color:var(--p-low)}.matrix .cell.Medium{color:var(--p-med)}.matrix .cell.High{color:var(--p-high)}.matrix .cell.Urgent{color:var(--p-urg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.node{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:13px;min-width:120px}
.node b{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.node.ev{border-top:3px solid var(--blue)}.node.cd{border-top:3px solid var(--amber)}.node.ac{border-top:3px solid var(--green)}
.arrow{color:var(--ink-3)}
.slot{border:2px dashed var(--line);border-radius:8px;padding:8px 10px;min-width:150px;min-height:48px;font-size:13px;color:var(--ink-3);background:var(--bg)}
.slot.filled{border-style:solid;color:var(--ink);background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;background:var(--card);cursor:pointer}
.chip:hover{border-color:var(--blue)}
.chip.used{opacity:.4;pointer-events:none}
.lifecycle{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.lc{flex:1;min-width:96px;border-radius:6px;padding:8px;font-size:12px;font-weight:700;text-align:center;background:var(--bg);border:1px solid var(--line);cursor:pointer}
.lc.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lc.past{background:var(--blue-2);color:var(--blue-ink)}
.cmdb{width:100%;height:auto;display:block}
.cmdb .n rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.cmdb .n text{fill:var(--ink);font:600 12px var(--font)}
.cmdb .n.hit rect{fill:var(--red-bg);stroke:var(--red)}
.cmdb .n.src rect{fill:var(--red);stroke:var(--red)}
.cmdb .n.src text{fill:#fff}
.cmdb line{stroke:var(--line);stroke-width:1.5}
.cmdb line.hit{stroke:var(--red);stroke-width:2.5}
.cmdb .n{cursor:pointer}
.flash{display:grid;place-items:center;min-height:180px;text-align:center;padding:24px;cursor:pointer;font-size:18px;font-weight:700}
.flash.back{font-size:15px;font-weight:400;color:var(--ink-2)}
.gl{display:grid;gap:8px}
.gl .term{padding:12px 16px}
.gl .term b{display:block}
.hide{display:none!important}
</style>
</head>

<script>
/* Course content. Block types:
   ["layer", label]  section marker (Top view / In the tool / Worked example / Try it / Watch out)
   ["top", text] simple top-view statement   ["p", text]   ["h", text]   ["list", [..]]   ["steps", [..]]
   ["path", "A > B > C"]   ["tip"|"watch"|"example"|"real", title, text]   ["table", [head..], [[row..]..]]
   ["mock", id]   ["widget", id]   ["quiz", question, [options], correctIndex, explanation]   ["desk", missionId, label] */
window.COURSE = {
  company: "Brightline Foods (Pune)",
  tracks: [
    { id: "start", title: "Start here", sub: "What Freshservice is, the words you will hear on day one, and a tour of the screen." },
    { id: "agent", title: "Daily agent work", sub: "Tickets from arrival to closure: working them, prioritising them and keeping SLAs." },
    { id: "itil", title: "Beyond the single ticket", sub: "Service requests, knowledge, problems, changes and assets: the ITIL practices Freshservice runs." },
    { id: "power", title: "Automation, AI and insight", sub: "How the desk runs itself: workflows, Freddy AI, reports, and the admin settings behind your screen." },
    { id: "finish", title: "Put it together", sub: "A full shift on the practice desk and the final check." }
  ],
  modules: [
  /* ================= START HERE ================= */
  {
    id: "m0", track: "start", title: "Freshservice in one picture", short: "What it is, who uses it and how work flows through it",
    outcomes: ["Explain in two sentences what Freshservice does.", "Name the three kinds of people in it: requester, agent, admin.", "Draw the path of one request from an employee to a resolved ticket."],
    lessons: [
      { id: "m0-what", title: "What Freshservice is", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "Freshservice is the place where employees ask IT (and other teams) for help, and where the people who help them keep track of every request until it is done."],
        ["p", "Think of it as a shared, rule-driven inbox. Every request becomes a **ticket** with an owner, a priority and a deadline. Nothing lives only in someone's email or memory, so nothing is forgotten, and managers can see how the team is doing."],
        ["p", "It is built by Freshworks and follows **ITIL**, the most widely used framework for running IT services. That is why you will see modules named after ITIL practices: Incidents, Service Requests, Problems, Changes, Releases and Assets."],
        ["layer", "In the tool"],
        ["table", ["Module", "What lives there", "Who uses it most"], [
          ["Tickets", "Incidents (something is broken) and service requests (I need something)", "Every agent, every day"],
          ["Problems", "The underlying cause behind repeated incidents", "Senior agents, problem managers"],
          ["Changes", "Planned changes to IT systems, with risk and approval", "Engineers, change managers, CAB"],
          ["Releases", "A bundle of changes delivered together", "Release managers"],
          ["Assets", "Laptops, servers, software, contracts and how they connect (the CMDB)", "Asset managers, every agent for lookups"],
          ["Solutions", "The knowledge base: how-to articles for agents and employees", "Everyone"],
          ["Analytics", "Reports and dashboards", "Team leads, managers"],
          ["Admin", "Settings: SLAs, forms, workflows, roles", "Administrators"]
        ]],
        ["layer", "Worked example"],
        ["p", "Throughout the course you follow **Brightline Foods**, a fictional food company headquartered in Pune with offices in Mumbai, Bengaluru and Chennai and plants in Nashik and Hosur. Around 1,200 employees, one IT service desk."],
        ["example", "A Monday at Brightline Foods", "At 08:55 Asha in Finance cannot open the payroll app. She clicks **Report an issue** on the IT portal. Freshservice creates ticket **INC-1042**, sets it to Open, starts the SLA clock, and a workflow routes it to the *Business Apps* group because the category is *Payroll*. Arjun picks it up, replies within 12 minutes, finds an expired licence, fixes it and marks the ticket Resolved. Asha gets an email, and a satisfaction survey."],
        ["p", "Every module in this course zooms in on one part of that story."],
        ["quiz", "Which statement best describes Freshservice?", ["An email client for the IT team", "A service desk tool that turns every request into a tracked ticket with an owner, priority and deadline", "A monitoring tool that watches servers", "A chat app for employees"], 1, "Freshservice can receive email and chat, and can link to monitoring alerts, but its core job is tracking requests as tickets from start to finish."]
      ]},
      { id: "m0-people", title: "Requesters, agents and admins", min: 5, blocks: [
        ["layer", "Top view"],
        ["top", "Requesters ask, agents help, admins set the rules. Most people in a company are requesters; you are an agent."],
        ["table", ["Role", "Who", "What they see", "Example at Brightline"], [
          ["Requester", "Any employee", "The **self-service portal**: raise requests, follow their tickets, read help articles", "Asha in Finance"],
          ["Agent", "Service desk staff", "The **agent console**: queues, tickets, problems, changes, assets", "You, Arjun, Priya"],
          ["Admin", "A few senior people", "Everything above plus **Admin** settings", "Suresh, the service desk lead"]
        ]],
        ["p", "Agents are organised into **groups** (also called agent groups), such as *Service Desk L1*, *Network*, *Business Apps* or *Field Support*. A ticket is normally assigned to a group first, then to one agent inside it."],
        ["p", "What an agent may do is set by their **role**. A new hire may get a read-only or limited role at first; a team lead may be allowed to delete tickets or edit automations. If a button you expect is missing, your role is the first thing to check."],
        ["layer", "In the tool"],
        ["p", "Freshservice can also host several **workspaces**, for example IT, HR and Facilities, each with its own tickets, forms and SLAs. An agent may belong to one or several. Employees still use one portal and pick the team they need."],
        ["watch", "Do not confuse group and role", "A **group** decides which tickets reach you. A **role** decides what you may do with them. Being moved to the Network group does not give you permission to approve changes."],
        ["quiz", "You cannot see the Delete button on a ticket that a colleague can delete. What is the most likely reason?", ["You are in a different group", "Your role does not include that permission", "The ticket is Pending", "Your browser needs refreshing"], 1, "Permissions come from roles. Groups only route work."]
      ]},
      { id: "m0-flow", title: "How one request flows", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "Arrive, classify, prioritise, assign, work, resolve, close. Every ticket walks the same seven steps."],
        ["widget", "flow"],
        ["steps", [
          "**Arrive**: by email to the support mailbox, the portal, a phone call logged by an agent, chat in Microsoft Teams or Slack, or an alert from a monitoring tool.",
          "**Classify**: incident or service request; category, subcategory and item (for example *Software › Payroll › Licence*).",
          "**Prioritise**: from impact and urgency to a priority of Low, Medium, High or Urgent. The priority picks the SLA deadlines.",
          "**Assign**: to a group, then an agent. Often done automatically by a workflow.",
          "**Work**: reply, add private notes, ask colleagues, link assets, log time.",
          "**Resolve**: the fix is in place; tell the requester what was done.",
          "**Close**: confirmed by the requester or automatically after a waiting period your admins set."
        ]],
        ["real", "Why the order matters", "Priority comes before assignment because the SLA clock starts when the ticket is created, not when someone notices it. A ticket left unclassified in the queue is already using its time."],
        ["quiz", "A ticket arrives at 09:00 and nobody touches it until 10:30. When did its SLA clock start?", ["10:30, when an agent opened it", "09:00, when it was created (within business hours)", "When it was assigned", "When the requester replied"], 1, "SLA due-by times are calculated from creation time, counted in business or calendar hours as the policy says."]
      ]}
    ]
  },
  {
    id: "m1", track: "start", title: "A tour of the agent console", short: "The screen you will live in",
    outcomes: ["Find your way around the left navigation.", "Read the ticket list at a glance.", "Know what each area of the ticket view is for."],
    lessons: [
      { id: "m1-nav", title: "The left navigation and the top bar", min: 5, blocks: [
        ["layer", "Top view"],
        ["top", "A dark bar on the left takes you to each module; the top bar holds search, the New button and your profile."],
        ["mock", "console"],
        ["list", [
          "**Dashboard**: your widgets: tickets assigned to you, overdue, unassigned, and so on.",
          "**Tickets**: the queue. Most of your day is here.",
          "**Problems, Changes, Releases**: shown when your plan and role include them.",
          "**Assets**: the asset inventory and CMDB.",
          "**Solutions**: knowledge base articles.",
          "**Analytics**: reports, if your role allows.",
          "**Admin** (gear icon): only for admins."
        ]],
        ["tip", "Search first, create second", "Before creating a ticket for a caller, search their name or the issue. Very often there is already an open ticket, and duplicates waste everyone's time."],
        ["p", "Exact icons and labels shift between Freshservice versions and depend on which modules your company bought. The structure stays the same."]
      ]},
      { id: "m1-list", title: "Reading the ticket list", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "Each row is one ticket. In two seconds you should be able to tell what it is, who asked, how urgent it is and whether it is late."],
        ["mock", "list"],
        ["list", [
          "**Views** on the left (or in a drop-down) are saved filters: *My open tickets*, *Unassigned in my groups*, *All urgent*. Pick a view before you start.",
          "**Sort** by due-by time so the ticket closest to breaching is on top.",
          "**Tags** such as *Response due* or *Overdue* tell you an SLA target has passed.",
          "**Bulk actions**: tick several rows to assign, close or update them together."
        ]],
        ["example", "Start-of-shift routine", "Priya opens *Unassigned in my groups*, sorts by due by, assigns the top three to herself, then switches to *My open tickets* and works top-down. Ten seconds of filtering saves an hour of hunting."],
        ["quiz", "Which sort order helps you avoid SLA breaches?", ["Newest first", "Requester name A–Z", "Due by, earliest first", "Ticket ID"], 2, "The due-by time is when the next SLA target expires. Working earliest-due first protects the SLA."]
      ]},
      { id: "m1-ticket", title: "Inside a ticket", min: 7, blocks: [
        ["layer", "Top view"],
        ["top", "The middle is the conversation; the right is the ticket's properties; the top holds the actions."],
        ["mock", "ticket"],
        ["table", ["Area", "What it is for"], [
          ["Header", "Subject, ticket ID, requester, and actions: Reply, Add note, Forward, Close, More (merge, print, delete, link)"],
          ["Conversation", "The original description, every reply and every private note, oldest first"],
          ["Properties panel", "Type, status, priority, urgency, impact, source, group, agent, category, due by, tags, custom fields"],
          ["Requester info", "Who asked, their department, location, other tickets and the assets assigned to them"],
          ["Associations", "Linked problem, change, assets, child tickets, tasks, time entries"],
          ["Activity", "A log of every change: who changed what, and when. Your audit trail."]
        ]],
        ["tip", "Update properties before you reply", "If you change status, group or priority and then reply, both are saved together and the requester gets one clean update. Most desks expect properties to be right before the first reply."],
        ["desk", "tour", "Open the practice desk and click through a ticket"]
      ]}
    ]
  },

  /* ================= DAILY AGENT WORK ================= */
  {
    id: "m2", track: "agent", title: "Tickets: incidents and service requests", short: "What a ticket is made of",
    outcomes: ["Tell an incident from a service request every time.", "Fill every important ticket field correctly.", "Use the four default statuses as intended."],
    lessons: [
      { id: "m2-types", title: "Incident or service request?", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "An incident is something that worked and now does not. A service request is asking for something new or standard."],
        ["table", ["", "Incident", "Service request"], [
          ["Question it answers", "What broke, and how fast can we restore it?", "What do you need, and has it been approved?"],
          ["Examples", "VPN keeps dropping; printer offline; payroll app error", "New laptop; access to a shared drive; software install"],
          ["Usually starts from", "Report an issue, email, phone, monitoring alert", "The service catalog on the portal"],
          ["Goal", "Restore service quickly (a workaround counts)", "Deliver the item, often after an approval"],
          ["ID prefix in many setups", "INC-", "SR-"]
        ]],
        ["example", "Three quick calls", "1) *Outlook crashes when I open attachments.* Incident. 2) *Can I get Visio installed?* Service request. 3) *My new starter needs a laptop on Monday.* Service request, ideally raised from the catalog item *New joiner kit*, not by email."],
        ["watch", "Requests disguised as incidents", "\"Urgent: I can't access the Sales drive\" may be a person who was never given access. That is a service request with an approval, not an incident. Check before you treat it as an outage."],
        ["quiz", "\"The conference room screen in Chennai shows no signal since this morning.\" What type?", ["Service request", "Incident", "Change", "Problem"], 1, "It worked before and now does not: an incident."],
        ["quiz", "\"Please add Meera to the Marketing distribution list.\"", ["Incident", "Service request", "Problem", "Release"], 1, "Nothing is broken; she is asking for a standard service."]
      ]},
      { id: "m2-fields", title: "The fields that matter", min: 8, blocks: [
        ["layer", "Top view"],
        ["top", "A good ticket answers who, what, how bad, and who owns it. The fields are just those questions."],
        ["table", ["Field", "Meaning", "Get it right because"], [
          ["Requester", "The person who needs help", "Replies, surveys and reports go to them"],
          ["Subject", "One-line summary", "Agents scan it in the queue; make it specific (\"VPN drops every 10 min – Chennai office\")"],
          ["Type", "Incident or Service Request", "Different processes, SLAs and reports"],
          ["Source", "Email, Portal, Phone, Chat, and others", "Shows where work comes from; some automations use it"],
          ["Status", "Open, Pending, Resolved, Closed (plus any custom ones)", "Drives SLA timers and what the requester sees"],
          ["Urgency", "How quickly the business needs it fixed", "Feeds priority"],
          ["Impact", "How many people or how much business is affected", "Feeds priority"],
          ["Priority", "Low, Medium, High, Urgent", "Selects the SLA targets"],
          ["Group / Agent", "Who owns it", "Unowned tickets breach"],
          ["Category › Subcategory › Item", "What it is about", "Routing, reporting, problem spotting"],
          ["Due by", "When the resolution target expires", "Calculated by the SLA; do not edit it to hide lateness"],
          ["Tags", "Free labels", "Quick grouping, e.g. *vpn*, *new-joiner*"]
        ]],
        ["real", "Categories are your future reports", "Six months from now somebody will ask: *how many VPN incidents did Chennai have?* That report is only as good as the categories agents picked today. Never leave *Other* if a real category fits."],
        ["quiz", "Which subject line is best?", ["Help!!!", "Issue", "Excel crashes on save – Finance shared workbook, since 09:10", "Problem with computer"], 2, "Specific, scannable, and it hints at scope and time."]
      ]},
      { id: "m2-status", title: "Statuses and the life of a ticket", min: 7, blocks: [
        ["layer", "Top view"],
        ["top", "Open means it is on us. Pending means we are waiting on someone else. Resolved means we think it is fixed. Closed means done."],
        ["widget", "status"],
        ["table", ["Status", "Use it when", "SLA clock (default setup)"], [
          ["Open", "New, or the ball is in the desk's court", "Running"],
          ["Pending", "You asked the requester or a third party something and are waiting", "Usually paused, so you are not penalised for waiting"],
          ["Resolved", "You believe the issue is fixed and told the requester", "Stopped"],
          ["Closed", "Confirmed, or automatically after a waiting period", "Stopped; the ticket is final"]
        ]],
        ["p", "Admins can add **custom statuses** such as *Awaiting vendor* or *Scheduled*, and decide for each one whether the SLA timer runs. Ask your lead which custom statuses your desk uses and what they mean."],
        ["p", "If the requester replies to a Pending or Resolved ticket, Freshservice normally moves it back to **Open** so that it lands in your queue again."],
        ["watch", "Pending is not a parking lot", "Setting a ticket to Pending without actually asking the requester something hides work and annoys auditors. Always send the question in the same update."],
        ["quiz", "You asked Asha to send a screenshot. Which status?", ["Open", "Pending", "Resolved", "Closed"], 1, "You are waiting on the requester; Pending pauses the clock in the default setup."],
        ["quiz", "Asha replies \"same error again\" to a Resolved ticket. What normally happens?", ["Nothing; it stays Resolved", "A brand-new ticket is always created", "The ticket reopens to Open", "It goes straight to Closed"], 2, "A requester reply reopens the ticket so the owner sees it again."]
      ]},
      { id: "m2-sources", title: "Where tickets come from", min: 5, blocks: [
        ["layer", "Top view"],
        ["top", "Tickets can arrive by email, portal, phone, chat, monitoring alerts and AI assistants, and all of them end up in the same queue."],
        ["table", ["Source", "How", "What to check"], [
          ["Email", "A message to the support address becomes a ticket; replies thread into it", "Missing details; people in CC"],
          ["Portal", "Employee fills a form or catalog item", "Usually well structured"],
          ["Phone", "You log the call yourself", "Write what was said; set the source to Phone"],
          ["Chat (Teams / Slack)", "Employee messages the service desk bot or channel", "Short descriptions; ask follow-ups"],
          ["Monitoring alert", "An integration turns an alert into a ticket", "May need linking to a wider incident"],
          ["Freddy AI Agent", "The AI assistant hands over when it cannot solve the request", "Read the bot transcript first"]
        ]],
        ["tip", "Phone tickets: write it for the next agent", "A phone ticket with the subject *call from user* is useless at handover. Capture symptoms, steps already tried and how to reach the caller."]
      ]}
    ]
  },
  {
    id: "m3", track: "agent", title: "Working a ticket", short: "Replies, notes, collaboration and tidy-up",
    outcomes: ["Choose correctly between reply, note and forward.", "Use canned responses and solution articles.", "Merge, split into child tickets, link and log time."],
    lessons: [
      { id: "m3-reply", title: "Reply, private note or forward", min: 7, blocks: [
        ["layer", "Top view"],
        ["top", "A reply goes to the requester. A private note is for agents only. A forward sends the ticket to someone outside the desk."],
        ["table", ["Action", "Who sees it", "Use it for"], [
          ["Reply", "Requester (and anyone in CC)", "Questions, updates, the fix"],
          ["Private note", "Agents only", "Troubleshooting steps, findings, handover, @mentioning a colleague"],
          ["Public note", "Requester can see it in the portal (if your desk uses it)", "Status updates that need no email"],
          ["Forward", "An external address you choose", "Asking a vendor or a person outside the desk"]
        ]],
        ["example", "One ticket, three actions", "Arjun adds a **private note**: *Licence for payroll app expired 21/10, renewed in vendor portal.* He **@mentions** Priya to double-check the renewal. Then he **replies** to Asha: *We renewed the licence; please sign out and back in. If it still fails, reply to this email.* Same ticket, two audiences."],
        ["watch", "The most expensive mistake", "Typing internal remarks into a Reply sends them to the requester. Before you press Send, look at the button label and the colour of the editor: notes usually look different from replies."],
        ["p", "A good reply has four parts: acknowledge, explain what happened in plain words, say what you did or need, and say what happens next."],
        ["quiz", "You found that the user's password was reset by HR by mistake. Where do you write that detail?", ["In the reply", "In a private note", "In the subject", "In a forward to HR's personal email"], 1, "Internal findings belong in a private note; the reply can simply say access was restored."]
      ]},
      { id: "m3-canned", title: "Canned responses and solution articles", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "Canned responses are reply templates with placeholders. Solution articles are your knowledge base. Both save typing and keep answers consistent."],
        ["p", "A canned response can contain **placeholders** that Freshservice fills in for you, such as the requester's name, the ticket ID or the ticket link. You insert one from the reply editor, then edit it before sending."],
        ["example", "Template in action", "Template *Password reset done*: \"Hi {{requester first name}}, your password for {{item}} has been reset. Ticket {{ticket id}} will close automatically if we don't hear from you.\" The agent picks it, checks the item, presses Send. 20 seconds instead of 3 minutes."],
        ["p", "From the reply editor you can also search **Solutions** and insert an article or its link. That is the right answer when a how-to already exists, and it teaches the employee to look there next time."],
        ["tip", "Edit, don't just paste", "A canned reply that says \"Hi ,\" because the placeholder was empty is worse than no template. Read it once before sending."],
        ["desk", "canned", "Practise: answer a ticket with a canned response"]
      ]},
      { id: "m3-collab", title: "Merge, child tickets, links and tasks", min: 8, blocks: [
        ["layer", "Top view"],
        ["top", "Merge duplicates, split big jobs into child tickets, link related records, and use tasks for checklists."],
        ["table", ["Tool", "Use when", "Example"], [
          ["Merge", "Two or more tickets are about the same thing from the same person", "Asha emailed and also called: merge the newer one into the older one"],
          ["Child ticket", "One request needs work by several teams", "New joiner: laptop (Field Support), accounts (Identity), phone (Telecom)"],
          ["Link to problem", "Many incidents share one cause", "30 VPN incidents linked to PRB-77"],
          ["Link to change", "A ticket needs a planned change, or a change caused it", "Firewall rule change CHN-310"],
          ["Associate asset", "The issue is about a specific device or system", "Asha's laptop BL-LT-0442"],
          ["Tasks", "Several steps that must be ticked off, possibly by others", "Collect old laptop; wipe; return to stock"],
          ["Time entry", "You need to record effort", "45 min on-site, billable to Finance"]
        ]],
        ["watch", "Merge carefully", "Merging cannot always be undone cleanly, and the merged ticket's requester is added to the primary. Only merge real duplicates. Ten different people with the same VPN problem are **not** duplicates: link them to one problem or a major incident instead."],
        ["quiz", "Fifteen employees report Teams calls dropping in the Mumbai office. What do you do?", ["Merge all fifteen into one ticket", "Link them to a parent incident or a problem, and keep each person's ticket", "Close fourteen as duplicates", "Ask each one to call the vendor"], 1, "Each person needs updates; linking keeps their tickets while one owner works the cause."],
        ["desk", "merge", "Practise: merge a duplicate and link to a problem"]
      ]},
      { id: "m3-speed", title: "Scenario automations: one click, many updates", min: 5, blocks: [
        ["layer", "Top view"],
        ["top", "A scenario automation is a saved bundle of actions you run on a ticket with one click."],
        ["example", "Scenario: Hand over to Network", "Set group = Network, priority = High, add tag *network*, add a private note *Handed over from L1 with ping results attached*. One click instead of four edits, and every agent does it the same way."],
        ["p", "Scenarios are created by admins (or agents with permission) and you run them from the ticket view. They act only on the ticket you are looking at, when you choose. That is the difference from workflows, which fire on their own."],
        ["desk", "scenario", "Practise: run a scenario on the practice desk"]
      ]}
    ]
  },
  {
    id: "m4", track: "agent", title: "Priority and SLAs", short: "Which ticket first, and by when",
    outcomes: ["Work out priority from impact and urgency.", "Read due-by times and know what pauses them.", "Explain escalation levels and OLAs."],
    lessons: [
      { id: "m4-priority", title: "Impact × urgency = priority", min: 7, blocks: [
        ["layer", "Top view"],
        ["top", "Impact is how big; urgency is how soon. Put them together and you get the priority."],
        ["widget", "matrix"],
        ["p", "Many desks use a matrix like this one. Some let agents set priority directly; others set it automatically from impact and urgency via a business rule or workflow. Either way, you need to be able to judge both values."],
        ["table", ["Situation at Brightline", "Impact", "Urgency", "Priority"], [
          ["Order system down for all plants", "High", "High", "Urgent"],
          ["One salesperson's laptop won't boot before a client pitch at 10:00", "Low", "High", "Medium"],
          ["Shared printer in HR is slow", "Medium", "Low", "Low"],
          ["Wi-Fi down on one floor of the Nashik plant, production unaffected", "Medium", "Medium", "Medium"]
        ]],
        ["watch", "Shouting is not urgency", "\"URGENT!!!\" in a subject line is the requester's feeling, not the business urgency. Ask: what stops if this is not fixed today?"],
        ["quiz", "Payroll must run today and the payroll app is down for the whole Finance team. Impact and urgency?", ["Low / Low", "Medium / High", "High / High", "Low / High"], 2, "Many users, and a deadline today: both high, so Urgent in this matrix."]
      ]},
      { id: "m4-sla", title: "SLA policies and due-by times", min: 9, blocks: [
        ["layer", "Top view"],
        ["top", "An SLA policy promises two times for every priority: when we will first respond and when we will resolve. Freshservice turns them into due-by times on each ticket."],
        ["table", ["Priority", "First response", "Resolution", "Hours"], [
          ["Urgent", "15 min", "4 h", "Calendar (24×7)"],
          ["High", "1 h", "8 h", "Business"],
          ["Medium", "4 h", "2 business days", "Business"],
          ["Low", "8 h", "5 business days", "Business"]
        ]],
        ["p", "That table is Brightline's example policy, not a Freshservice default. Your company sets its own numbers."],
        ["list", [
          "**First response due**: when the first agent reply is expected.",
          "**Resolution due** (shown as *Due by*): when the ticket should be resolved.",
          "**Business vs calendar hours**: business hours skip nights, weekends and the holiday list for that business-hours calendar; calendar hours count every minute. Indian desks usually load the national holidays (Republic Day, Independence Day, Gandhi Jayanti) plus state and festival holidays such as Diwali or Onam for each office; some also work Saturdays, which needs its own business-hours calendar.",
          "**Several policies**: you can have more than one, chosen by conditions such as requester, group or category. Workspace-level policies are checked first; if none match, the global one applies.",
          "**Tags**: a ticket past its first-response target gets a *Response due* style flag; past resolution it is *Overdue*."
        ]],
        ["widget", "sla"],
        ["example", "Friday evening ticket", "A High ticket arrives Friday 17:30. Business hours are Mon–Fri 09:00–18:00 IST. 30 minutes count on Friday, the other 30 minutes of the 1-hour response target run on Monday from 09:00, so first response is due Monday 09:30, not Friday 18:30."],
        ["quiz", "A Medium ticket (resolution 2 business days) is set to Pending for a full day while you wait for the user. With the default setup, what happens to the due-by time?", ["It stays the same, so you breach", "The timer pauses, so the due-by time moves later", "The ticket closes", "Priority drops to Low"], 1, "Pending normally pauses the SLA timer."]
      ]},
      { id: "m4-escalate", title: "Escalations, OLAs and what to do near a breach", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "If a target is about to be missed, Freshservice can notify people automatically, in up to several levels, so someone acts before the customer notices."],
        ["p", "In the SLA policy, admins set **escalation rules**: for example, if the response target is missed, email the group lead; if resolution is 2 hours overdue, email the service desk manager; at 8 hours, the IT director. Freshservice supports one level for response and up to four levels for resolution."],
        ["p", "An **OLA** (operational level agreement) is the internal version: the time one team promises another. Example: the Network group promises to answer L1 hand-overs within 2 hours, inside the overall 8-hour SLA."],
        ["steps", [
          "Sort your view by due by every morning and after lunch.",
          "If a ticket will breach and you cannot fix it, say so early: private note plus a message to your lead.",
          "Give the requester an honest update; a clear delay message beats silence.",
          "Never change the due-by date or priority just to avoid a breach. It is visible in the activity log and is the fastest way to lose trust."
        ]],
        ["quiz", "What is an OLA?", ["A contract with a vendor", "An internal time promise between teams", "The SLA for VIP users", "A type of change"], 1, "SLA: to the customer. OLA: between internal teams. Contracts with vendors are underpinning contracts."]
      ]}
    ]
  },
  {
    id: "m5", track: "agent", title: "Queues, groups and routing", short: "Getting the right ticket to the right person",
    outcomes: ["Use views and filters like a pro.", "Understand automatic assignment.", "Hand over cleanly."],
    lessons: [
      { id: "m5-views", title: "Views and filters", min: 5, blocks: [
        ["layer", "Top view"],
        ["top", "A view is a saved question: \"show me all open Network tickets due today\". Build the few you need and use them every day."],
        ["list", [
          "Filter by **status, priority, group, agent, type, category, created, due by, tags** and custom fields.",
          "Save a filter as a **view**; share it with your group if your role allows.",
          "Combine with **sort by due by** and you have a to-do list."

        ["example", "Three views every L1 agent should have", "1) *Unassigned – my groups*. 2) *Mine – open and pending, sorted by due by*. 3) *Overdue – my groups*. Check them in that order."]
      ]},
      { id: "m5-assign", title: "Automatic assignment and hand-overs", min: 7, blocks: [
        ["layer", "Top view"],
        ["top", "Rules route the ticket to a group; the group can then share tickets among its agents automatically."],
        ["p", "Routing to the right **group** is usually done by the Workflow Automator: when a ticket is created and the category is *Network*, set group = Network. Inside a group, admins can switch on automatic assignment so new tickets are shared between available agents (for example round robin), instead of everyone cherry-picking."],
        ["layer", "Worked example"],
        ["example", "A clean hand-over from L1 to Network", "Priya cannot fix a site VPN issue. She adds a private note: what the user sees, which office, what she checked (\"ping to gateway 40% loss, other sites fine\"), attaches the output, sets group = Network, leaves agent empty, and replies to the user: \"I've passed this to our network team, who will contact you.\" The Network engineer starts from her findings instead of from zero."],
        ["watch", "Ticket ping-pong", "A ticket bouncing between groups with no note is the classic service-desk failure. If you send it on, say why and what you already tried."],
        ["quiz", "When handing a ticket to another group, what is essential?", ["Lower the priority", "A private note with findings and why you are handing over", "Close and reopen it", "Change the requester"], 1, "Context travels with the ticket only if you write it down."]
      ]}
    ]
  },

    lessons: [

        ["path", "Admin > Service Management > Service Request Management > Service Catalog"],
        ["p", "Menu paths differ slightly between versions and between global and workspace settings. If you are not an admin you will not see this; you will see the result in the portal and in the tickets."]
      ]},
      { id: "m6-flow", title: "Approval and fulfilment", min: 8, blocks: [
        ["layer", "Top view"],
        ["top", "Request, approve, fulfil, confirm. The workflow does the chasing; you do the delivering."],
        ["steps", [
          "Asha orders *Adobe Acrobat Pro* in the portal and fills in the reason and cost centre.",
          "A workflow sends an **approval** to her manager (and, above a cost threshold, to Finance).",

        ["quiz", "Why use child requests for a new joiner?", ["To hide work from the requester", "So each delivering team owns its part with its own SLA, while the parent shows overall progress", "Because one ticket cannot have more than one field", "To create duplicates"], 1, "Parent-child keeps one view for HR and clear ownership for each team."],
        ["desk", "request", "Practise: fulfil an approved software request"]
      ]}
    ]
  },
  {
    id: "m7", track: "itil", title: "Knowledge: the Solutions module", short: "Write it once, solve it many times",
    outcomes: ["Find and use articles while working tickets.", "Write an article that people actually follow.", "Know how knowledge reduces tickets."],
    lessons: [
      { id: "m7-kb", title: "How the knowledge base is organised", min: 5, blocks: [
        ["layer", "Top view"],
        ["top", "Categories hold folders; folders hold articles. Some folders are for agents only, others are public in the portal."],
        ["list", [
          "**Category** › **Folder** › **Article**, for example *IT help* › *VPN* › *Connect to VPN on Windows*.",
          "Folder **visibility** decides who can read: all employees, specific departments, or agents only.",
          "Articles can be **draft** or **published**; some desks add a review or approval step before publishing.",
          "The portal search shows matching articles while an employee types a new request, which can stop a ticket before it is raised (deflection)."

        ["layer", "Top view"],
        ["top", "One problem, one article. Title it the way the user would search for it, and give steps they can follow without you."],
        ["table", ["Weak", "Strong"], [

    ]
  }

  {
    id: "m8", track: "itil", title: "Problem management", short: "Stop the same incident from coming back",
    outcomes: ["Tell a problem from an incident.", "Record root cause, impact, symptoms and workaround.", "Use known errors to help other agents."],
    lessons: [
      { id: "m8-what", title: "Incident vs problem", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "Incident management puts out the fire. Problem management finds out why it keeps starting."],
        ["table", ["", "Incident", "Problem"], [
          ["Question", "How do we restore service now?", "Why does this happen, and how do we stop it?"],
          ["Speed", "Minutes to hours", "Days to weeks"],
          ["Success", "User working again", "No more incidents of this kind"],
          ["Example", "Asha's payroll app shows a licence error", "Licences for the payroll app expire without warning every quarter"]
        ]],
        ["p", "A problem record is opened when incidents repeat (**reactive**) or when trends show a risk before anyone is hurt (**proactive**). Any number of incidents can be linked to one problem."]
      ]},
      { id: "m8-record", title: "Root cause, workaround and known errors", min: 8, blocks: [
        ["layer", "In the tool"],
        ["p", "A problem record in Freshservice has fields for **root cause**, **impact** and **symptoms**, plus a **solution or workaround** that can link a knowledge article. You can link incidents, assets (CIs) and a change, add notes and tasks, and see an activity timeline."],
        ["steps", [
          "From one of the incidents, create or link a problem (or create it from the Problems module).",
          "Link all related incidents so their number shows the real scale.",
          "Record symptoms and impact as you know them now.",
          "Find the root cause; record it.",
          "While the fix is pending, document a workaround and mark the problem as a **known error**.",
          "Raise a change to apply the permanent fix; link it to the problem.",
          "When the change is done, resolve the problem and update the linked incidents."
        ]],
        ["example", "Known error in practice", "PRB-77: *VPN drops every 10–15 minutes for Chennai users*. Root cause: firewall session timeout set to 600 s after an upgrade. Workaround: reconnect, or use the backup VPN profile (article linked). Known error: yes. Fix: CHN-310 to set the timeout back. Every new Chennai VPN incident gets linked to PRB-77 and answered with the workaround in two minutes."],
        ["quiz", "What makes a problem a \"known error\"?", ["It has been closed", "The root cause and a workaround are documented, while the permanent fix is pending", "It has more than ten incidents", "A vendor caused it"], 1, "Known error = we know why, and we know how to work around it."]
      ]}
    ]
  },
  {
    id: "m9", track: "itil", title: "Change and release management", short: "Changing IT without breaking it",
    outcomes: ["Pick the right change type.", "Fill the planning fields that CAB looks at.", "Follow a change through its lifecycle."],
    lessons: [
      { id: "m9-types", title: "Change types", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "The riskier the change, the more planning and approval it needs. The change type tells everyone which path to follow."],
        ["table", ["Type (Freshservice defaults)", "Meaning", "Approval", "Example"], [
          ["Standard", "Pre-approved, routine, low risk", "None per change; the template was approved once", "Monthly OS patch on office laptops"],
          ["Minor", "Low impact but goes through every stage", "CAB", "Website text change"],
          ["Major", "Medium to high impact, may cost money", "CAB and management", "Moving to a new data centre in Navi Mumbai"],
          ["Emergency", "Must happen now to stop or prevent serious harm", "Emergency CAB, full review afterwards", "Security patch for an exploited flaw"]
        ]],
        ["p", "Admins can rename or switch off types; many companies use the ITIL trio Standard / Normal / Emergency instead."],
        ["quiz", "A critical vulnerability is being exploited on the web servers tonight. Which type?", ["Standard", "Minor", "Major", "Emergency"], 3, "It cannot wait for the next CAB, so it goes the emergency route and is reviewed afterwards."]
      ]},
      { id: "m9-plan", title: "Planning fields, risk and the CAB", min: 8, blocks: [
        ["layer", "In the tool"],
        ["table", ["Field", "What a good answer contains"], [
          ["Reason for change", "Why now, and what happens if we don't (link the problem)"],
          ["Impact", "Services, users and sites affected; expected downtime"],
          ["Rollout plan", "Step by step, with who does what and when"],
          ["Backout plan", "How to undo it, and the point at which you decide to back out"],
          ["Planned start / end", "The window; check the change calendar for clashes"],
          ["Risk, impact, priority", "Honest values; they decide the approval path"],
          ["Associated assets", "Which CIs are touched, so impact can be checked in the CMDB"]
        ]],
        ["p", "The **CAB** (change advisory board) reviews normal and major changes. In Freshservice, approvals are requested from individuals or groups, and each approver approves or rejects with a comment. The **change calendar** shows planned changes so two teams don't work on the same system in the same window."],
        ["watch", "No backout plan, no change", "\"Revert if needed\" is not a backout plan. CABs reject changes without concrete undo steps, and they are right to."]
      ]},
      { id: "m9-life", title: "The change lifecycle and releases", min: 6, blocks: [
        ["layer", "Top view"],
        ["top", "Open, plan, approve, implement, review, close. A change lifecycle can force these steps in order."],
        ["widget", "lifecycle"],
        ["p", "Admins can switch on **Change Lifecycle** to define allowed transitions per change type (for example, a Major change cannot jump from Planning to Implementation without passing Awaiting Approval)."],
        ["p", "A **release** bundles several changes delivered together, for example *Payroll app v5.2* containing a database change, an app deployment and a client update. Release records track build, test and deployment dates."],
        ["desk", "change", "Practise: raise the change behind PRB-77"]
      ]}

  {
    id: "m10", track: "itil", title: "Assets and the CMDB", short: "Knowing what you have and how it connects",

    lessons: [
      { id: "m10-assets", title: "Assets, CI types and relationships", min: 7, blocks: [
        ["layer", "Top view"],
        ["top", "The asset inventory lists everything IT manages. The CMDB adds how those things depend on each other."],
        ["list", [
          "**Asset types** form a tree: *Hardware › Computer › Laptop*, *Software*, *Network › Router*, *Services*, *Cloud*. Each type has its own fields.",
          "Each asset has a **state** (In use, In stock, In repair, Retired), a **used by** person, a location, department and often a **contract** (warranty, licence).",

        ["example", "Why relationships matter", "PRD-DB-01 needs a reboot. Its relationships show that payroll, the HR portal and timesheets all depend on it, so the change is planned for Sunday 02:00 and the three service owners are told. Without the CMDB, someone would find out at 09:00 on Monday."]
      ]},
      { id: "m10-discover", title: "Where asset data comes from", min: 5, blocks: [
        ["layer", "In the tool"],
        ["table", ["Source", "What it brings in"], [
          ["Discovery Probe", "Scans the network and adds the devices it finds"],

        ["p", "IT works the same way inside a company. When you send an email, you don't think about mail servers, licences, spam filters or backups. The IT department runs all of that, and you just get the result: email that works. **Email is a service that IT provides to you.**"],
