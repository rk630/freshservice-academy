/* interview bank: [level, question, model answer] */
window.QBANK = [
  ["Basic", "What is ITSM?", "IT service management is how an IT organisation designs, delivers, supports and improves IT services for its users, using defined practices instead of ad-hoc effort. Example: every request becomes a ticket with an owner, a priority and a target time."],
  ["Basic", "What is ITIL and how is it related to ITSM?", "ITIL is the most widely used framework of good practice for ITSM. ITSM is the discipline; ITIL describes practices such as incident, problem and change management. ITIL 4 is the current version with 34 practices and seven guiding principles."],
  ["Basic", "Incident vs service request?", "An incident is an unplanned interruption or reduction in quality of a service: something that worked now doesn't. A service request is a request for something standard: access, software, hardware, information. Different goals: restore quickly vs deliver correctly, often after approval."],
  ["Basic", "Incident vs problem?", "An incident is one occurrence; a problem is the underlying cause of one or more incidents. Incident management restores service; problem management finds and removes the cause so incidents don't recur."],
  ["Basic", "What is a known error?", "A problem whose root cause and a workaround are documented, while the permanent fix is pending. Agents use it to resolve new incidents quickly."],
  ["Basic", "How is priority decided?", "From impact (how many people or how much business is affected) and urgency (how quickly it is needed), usually through a matrix. High impact and high urgency gives the top priority."],
  ["Basic", "What is an SLA? And an OLA?", "An SLA is an agreed target between IT and its customers, such as respond in 1 hour and resolve in 8 for High priority. An OLA is an internal agreement between teams that supports the SLA, such as Network answers L1 hand-overs within 2 hours."],
  ["Basic", "First response time vs resolution time?", "First response is the time until the first agent reply to the requester. Resolution time is creation to resolved. Both have their own SLA targets."],
  ["Basic", "What does L1, L2, L3 mean?", "Support levels. L1: the service desk, first contact and common fixes. L2: specialist teams. L3: deep experts, developers or vendors."],
  ["Basic", "What is a CMDB?", "A configuration management database: the record of configuration items (servers, apps, laptops, services) and how they depend on each other. Used for impact analysis, change planning and faster troubleshooting."],
  ["Basic", "What are the types of change?", "Standard: pre-approved, low risk, routine. Normal (Minor/Major in Freshservice defaults): assessed and approved by CAB. Emergency: urgent fix with an emergency approval and review afterwards."],
  ["Basic", "What is a CAB?", "The change advisory board: people who review normal and major changes for risk, impact, timing and readiness, and recommend approval or rejection."],
  ["Basic", "What is a service catalog?", "The published list of services and items users can request, each with its own form, approvals and fulfilment steps."],
  ["Basic", "Name the ITIL 4 guiding principles.", "Focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimise and automate."],
  ["Basic", "What metrics does a service desk track?", "First response time, resolution time / MTTR, SLA compliance, first contact resolution, reopen rate, backlog and its age, CSAT, volume by category and channel."],
  ["Freshservice", "What are the default ticket statuses and what do they do to the SLA?", "Open (timer running), Pending (waiting on someone; timer normally paused), Resolved and Closed (timer stopped). Admins can add custom statuses and choose whether the SLA timer runs in each."],
  ["Freshservice", "Reply vs private note vs forward?", "A reply goes to the requester and CCs. A private note is visible only to agents, used for findings and hand-overs. Forward sends the ticket to an external address such as a vendor."],
  ["Freshservice", "How does Freshservice decide which SLA policy applies?", "SLA policies have conditions. Workspace-level policies are checked first; if none match, the global policy applies, and a default policy covers everything else. Targets are set per priority, in business or calendar hours, with escalation levels."],
  ["Freshservice", "How many escalation levels can an SLA have?", "One level for response and up to four levels for resolution, each with whom to notify and after how long."],
  ["Freshservice", "Workflow Automator vs Supervisor vs Scenario automation?", "Workflow Automator: event-condition-action flows triggered by events on records. Supervisor: time-based checks on tickets. Scenario automation: a saved bundle of actions an agent runs with one click."],
  ["Freshservice", "What is a reader node / web request node?", "Workflow nodes that fetch data for use later in the flow (reader) and call an external API (web request), used for integrations and lookups."],
  ["Freshservice", "Merge vs parent-child vs link to problem?", "Merge combines true duplicates from the same requester. Parent-child splits one job across teams or groups many tickets under one major incident. Linking to a problem connects many incidents with a shared cause while each requester keeps their ticket."],
  ["Freshservice", "What are canned responses?", "Reply templates with placeholders such as requester name and ticket ID, inserted from the reply editor and edited before sending."],
  ["Freshservice", "How do child requests from the service catalog work?", "Additional items on a catalog item can be set to create child requests, each linked to the parent and handled by the right team under its own SLA."],
  ["Freshservice", "What are workspaces?", "Separate areas for teams such as IT, HR and Facilities, each with its own tickets, forms, SLAs and workflows, while employees use a single portal."],
  ["Freshservice", "How does asset discovery work?", "The Discovery Probe scans the network; the Discovery Agent runs on devices and sends hardware and software details; integrations bring data from tools like Intune, JAMF, SCCM and cloud providers. Matching fields such as serial number update existing records."],
  ["Freshservice", "What is Freddy AI?", "Freshservice's AI: AI Agent for employee self-service (portal, Teams, Slack), Copilot for agents (summaries, reply suggestions, field suggestions, post-incident reports), Insights for leaders. Availability depends on plan and add-ons; agents remain responsible for reviewing AI output."],
  ["Freshservice", "Business rules for forms: what for?", "Show, hide, make mandatory or set fields on forms based on other field values, so the form asks only what is relevant."],
  ["Freshservice", "Ticket status numbers in the API?", "In the Freshservice API v2, statuses are numbers: 2 Open, 3 Pending, 4 Resolved, 5 Closed. Priority is 1 Low, 2 Medium, 3 High, 4 Urgent."],
  ["Freshservice", "How would you find why a ticket changed by itself?", "Open its activity log: it names the workflow, automation or agent that made each change and when."],
  ["Scenario", "Twenty users report email is down within ten minutes. What do you do?", "Recognise a major incident; create or flag one parent ticket as Urgent and inform the lead; link incoming tickets as children; send an update with the next update time; engage the messaging team; resolve the parent so all children get the closure note; open a problem for root cause and run a post-incident review."],
  ["Scenario", "A VIP shouts that his issue is urgent but it affects only a cosmetic setting. How do you handle it?", "Acknowledge politely, explain how priority is set, and agree a realistic time. Priority follows impact and urgency, not volume. If the desk has a VIP policy, apply it transparently. Keep him updated proactively."],
  ["Scenario", "You will miss a resolution SLA in one hour. What do you do?", "Check if a workaround restores service now; ask for help or escalate early with a private note; update the requester honestly with the next step and time; never change priority or due dates to hide it; record the reason for the breach for review."],
  ["Scenario", "The same printer fails every week. What do you do?", "Link the incidents, open a problem, check the asset's history in the CMDB, find the cause with the vendor or Field Support, record a workaround as a known error, and raise a change or replacement request for the permanent fix."],
  ["Scenario", "A user asks for admin rights on her laptop 'urgently'.", "Treat it as a service request, not an incident; check the policy; route through the catalog item with manager and security approval; offer a safe alternative if a specific software install is the real need."],
  ["Scenario", "Tickets keep bouncing between Network and Business Apps.", "Review a sample of bounced tickets; clarify ownership in categories and routing rules; require a private note on every hand-over; agree an OLA; measure reassignment count before and after."],
  ["Scenario", "An emergency firewall change is needed tonight.", "Raise an emergency change with impact and backout plan, get emergency CAB approval per policy, communicate the window, implement, verify, and complete the full review and documentation afterwards."],
  ["Scenario", "A requester never replies to your question.", "Set the ticket to Pending with the question asked; let a time-based automation send reminders; close it after the agreed waiting period with a note on how to reopen."],
  ["Scenario", "Your SLA compliance dropped from 92% to 80% this month. How do you investigate?", "Break it down by priority, group, category and time of day; compare volume vs staffing; look for one new issue driving volume; check if SLA settings or business hours changed; propose fixes such as a known-error article, routing change or shift change; track weekly."],
  ["Scenario", "How would you onboard 50 new joiners every month efficiently?", "A New joiner catalog item filled by HR, with child requests per team (laptop, accounts, badge), approvals where needed, tasks with due dates before the start date, and a dashboard of upcoming joiners."],
  ["Scenario", "A workflow you built is assigning tickets to the wrong group.", "Disable or narrow it, read the activity log of affected tickets, test the conditions with sample tickets, fix the order or condition, re-test, re-route affected tickets, and document the change."],
  ["Scenario", "How do you handle an angry requester on the phone?", "Let them finish, acknowledge the impact, restate the issue, explain what you will do and by when, log it accurately, and follow up before the promised time."],
  ["Expert", "How would you design an SLA model for a company with offices in India and the UK?", "Separate business-hours calendars per region with their own holidays; SLA policy conditions by location or group; Urgent in calendar hours; OLAs for resolver groups; escalation per region; reports per region."],
  ["Expert", "How would you implement Freshservice from scratch?", "Discover current pain and volumes; agree scope and priorities; design processes, categories, priorities and SLAs; configure people, groups, roles, fields, SLA, catalog, workflows, knowledge and assets; migrate data if needed; test with real scenarios; train agents and pilot; go live with hypercare; review metrics and improve."],
  ["Expert", "How do you keep a CMDB accurate?", "Automate discovery, define CI types and mandatory fields, assign data owners, reconcile duplicates by serial or hostname, link changes to CIs, run regular audits and report on stale records."],
  ["Expert", "How would you reduce ticket volume by 20%?", "Analyse top categories; remove repeat causes through problem management; add self-service (articles, automated password reset, catalog); improve portal deflection; use an AI agent for FAQs; measure deflection and repeat rate."],
  ["Expert", "How do you integrate Freshservice with another system?", "Use marketplace apps first; otherwise the REST API v2 with API-key authentication, or web request nodes in Workflow Automator; define the data mapping, error handling and ownership; test in a sandbox where available."],
  ["Expert", "How would you migrate from another ITSM tool to Freshservice?", "Decide what to migrate (open tickets, history, assets, knowledge); map fields, statuses and categories; clean data; migrate via import or API; run in parallel briefly; freeze the old tool; validate counts and samples."],
  ["Expert", "How do you measure the success of a service desk beyond SLA?", "Experience (CSAT, effort), quality (reopens, first contact resolution), efficiency (cost per ticket, deflection), stability (repeat incidents, change success rate), and business outcomes such as onboarding ready on day one."],
  ["Expert", "What makes a good change process without slowing teams down?", "Risk-based paths: standard changes pre-approved from templates, light review for low risk, CAB only for higher risk; a change calendar; automation for approvals; measure change success and lead time."],
  ["Expert", "How would you use enterprise service management (ESM) in Freshservice?", "Extend the same service desk model to HR, Facilities and Finance through workspaces, each with its own catalog, SLAs and workflows, while employees use one portal."],
  ["Expert", "What would you put on a service desk manager's dashboard?", "Backlog by age and priority, SLA compliance trend, created vs resolved, tickets by category and channel, reopen rate, CSAT, agent workload, top recurring issues."],
  ["Behavioural", "Tell me about a time you handled a deadline under pressure.", "Use STAR with a real example from your previous job or your volunteer desk: the situation, your responsibility, the steps you took, and a measurable result."],
  ["Behavioural", "Tell me about a process you improved.", "STAR: for example, you noticed repeat queries, wrote a template or article, and repeat queries dropped. Give the number."],
  ["Behavioural", "Why are you moving to IT?", "Connect your past to service management, show the steps you took (training, labs, capstone, live desk, certification) and what attracts you to the role. Positive and specific."],
  ["Behavioural", "What did you learn from your Freshservice project?", "Name one design decision and one mistake you fixed, for example a workflow condition that misrouted tickets and how you caught it in the activity log."],
  ["Behavioural", "How do you handle a mistake you made?", "Own it, fix the impact, tell the people affected, find the cause, prevent it next time. Give a real example."]
];

  var m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><header>' + esc(title) + '<button class="iconbtn" id="mx" type="button" aria-label="Close">✕</button></header><div class="bd">' + html + '</div></div>';
  document.body.appendChild(m);
  m.addEventListener("click", function (e) { if (e.target === m) closeModal(); });
  $("#mx", m).addEventListener("click", closeModal);
  wire(m);
  var f = $("button, select, input, textarea", $(".bd", m)); if (f) f.focus();
}
function closeModal() { var m = $("#modal"); if (m) m.remove(); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

function copyText(t) {
  function fallback() { var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Select the text and copy it manually"); } ta.remove(); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(function () { toast("Copied"); }, fallback); else fallback();
}

WIDGETS.mock = function (el) {

    var q = Q[cur];

WIDGETS.sorter = function (el) {
  var ITEMS = [["The office Wi-Fi stopped working this morning", 0], ["Can I get access to the Marketing shared folder?", 1], ["The same app has crashed every Monday for a month: why?", 2], ["Upgrade the email server next Sunday night", 3], ["I need a second monitor", 1], ["My laptop shows a blue error screen", 0], ["Move all files to a new storage system", 3], ["Printers on floor 2 fail after every update: find the cause", 2]];

/* =============== ROUTER =============== */
function route() {
  closeModal(); qn = 0; var restored = false;
  var p = location.hash.replace(/^#\/?/, "").split("/");
  try {
    if (!p[0]) pageHome();
    else if (p[0] === "course") pageCourse();
    else if (p[0] === "m") pageModule(p[1]);
    else if (p[0] === "l") pageLesson(p[1]);
    else if (p[0] === "desk") pageDesk(p[1]);
    else if (p[0] === "tools") pageTools();
    else if (p[0] === "glossary") pageGlossary();
    else if (p[0] === "exam") pageExam();
    else if (p[0] === "guide") pageGuide();
    else if (p[0] === "refs") pageRefs();
    else if (p[0] === "kit") pageKit();
    else if (p[0] === "search") pageSearch(decodeURIComponent(p.slice(1).join("/")));
    else pageHome();
    var restored = restoreReturn();
  } catch (err) { VIEW.innerHTML = '<div class="page"><h1>This page could not load</h1><p>' + esc(err.message) + '</p><a class="btn" href="#/">Go to Home</a></div>'; console.error(err); }
  if (!restored) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
})();
